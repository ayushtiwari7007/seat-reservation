services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: seat_reservation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-auth1234}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seat_reservation_db"]
      interval: 3s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/seat_reservation_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-auth1234}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-jwt-secret-32chars}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
