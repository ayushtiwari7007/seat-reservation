databases:
  - name: seat-reservation-db
    databaseName: seat_reservation_db
    user: seat_reservation
    plan: free

services:
  - type: web
    name: seat-reservation-api
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: seat-reservation-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: seat-reservation-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: seat-reservation-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: seat-reservation-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: seat-reservation-db
          property: password
      - key: JWT_SECRET
        generateValue: true
